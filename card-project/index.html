<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form project</title>
</head>
<body>
    <main>
        <section class="login-page">
            <div class="login-content">
            <form action = " " id = "login-form">
                <h1 class="form-heading">
                    Create an account
                </h1>
                <p class="form-para">
                        Access  your tasks , notes, and projects anytime,
                        anywhere - and keep everything flowing in one place.
                    </p>
                <label for = "email">Your email:</label>
                <input type = "text" class = "email" id = "email" placeholder="johndoe@gmail.com" required/>
                <label for ="password">Password: </label>
                <input type ="password" class = "password" id = "password" placeholder = "**********" required/>
                <button class = "submit" id = "submit">Login</button>

                <p class="or">or</p>
                <button class="google-login"><span class="icon">#4285F4</span><span>Continue with Google</span></button>
                <button class="apple-login"><span>Continue with Apple </span></button>
            </form>
            </div>
        </section>
        <section class="why-us">

        </section>
    </main>
</body>
</html>
